name: Require PR branch to be up to date with main
 
on:
  pull_request_target:
    branches:
      - integration
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
 
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
 
jobs:
  check-main-merged:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
 
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
 
      - name: Fetch main branch
        run: git fetch origin main
 
      - name: Verify PR branch contains latest main commit
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          echo "Latest main SHA: $MAIN_SHA"
 
          COMMITS_BEHIND=$(git rev-list HEAD..origin/main --count)
          echo "Commits this branch is behind main: $COMMITS_BEHIND"
 
          if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "✓ PR branch is up to date with main. Good to go."
          else
            echo ""
            echo "✗ ERROR: This PR branch is $COMMITS_BEHIND commit(s) behind main."
            echo ""
            echo "Missing commits:"
            git log HEAD..origin/main --oneline | head -5
            if [ "$COMMITS_BEHIND" -gt 5 ]; then
              echo "  ... and $((COMMITS_BEHIND - 5)) more commit(s) not shown."
            fi
            echo ""
            echo "Branches must always be kept in sync with main before merging."
            echo ""
            echo "  Option 1 - Rebase (keeps history linear, preferred):"
            echo "    git fetch origin"
            echo "    git rebase origin/main"
            echo "    git push --force-with-lease"
            echo ""
            echo "  Option 2 - Merge:"
            echo "    git fetch origin"
            echo "    git merge origin/main"
            echo "    git push"
            echo ""
            echo "Once pushed, this check will re-run automatically."
            exit 1
          fi
